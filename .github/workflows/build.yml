                      listX = (this.width - listW) / 2;
                      int y = Math.max(34, (this.height - 190) / 2 + 8);

                      field = new TextFieldWidget(this.textRenderer, listX, y, listW - 64, 20, Text.literal("Nama akun"));
                      field.setMaxLength(16);
                      field.setPlaceholder(Text.literal("Ketik nama (cari / tambah)"));
                      field.setText(filter);
                      field.setChangedListener(t -> {
                          filter = t;
                          accPage = 0;
                          rebuildList();
                      });
                      this.addDrawableChild(field);

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Tambah"), b -> addAccount())
                              .dimensions(listX + listW - 60, y, 60, 20).build());

                      listY = y + 26;
                      int ny = listY + 5 * 22;
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("<"), b -> {
                          if (accPage > 0) {
                              accPage--;
                              rebuildList();
                          }
                      }).dimensions(listX, ny, 24, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(Text.literal(">"), b -> {
                          accPage++;
                          rebuildList();
                      }).dimensions(listX + listW - 24, ny, 24, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("< Kembali"), b -> this.close())
                              .dimensions(listX, ny + 24, listW, 20).build());

                      rebuildList();
                  }

                  private List<String> filtered() {
                      String f = filter == null ? "" : filter.toLowerCase();
                      List<String> r = new ArrayList<>();
                      for (String a : Config.get().accounts) {
                          if (f.isEmpty() || a.toLowerCase().contains(f)) {
                              r.add(a);
                          }
                      }
                      return r;
                  }

                  private void rebuildList() {
                      for (ClickableWidget w : listWidgets) {
                          this.remove(w);
                      }
                      listWidgets.clear();
                      List<String> list = filtered();
                      int per = 5;
                      int pages = Math.max(1, (list.size() + per - 1) / per);
                      if (accPage >= pages) {
                          accPage = pages - 1;
                      }
                      pageText = (accPage + 1) + "/" + pages;
                      String cur = Accounts.currentName();
                      for (int i = 0; i < per; i++) {
                          int idx = accPage * per + i;
                          if (idx >= list.size()) {
                              break;
                          }
                          String name = list.get(idx);
                          ButtonWidget sel = ButtonWidget.builder(
                                  Text.literal((name.equals(cur) ? "> " : "") + name),
                                  b -> select(name)).dimensions(listX, listY + i * 22, listW - 28, 20).build();
                          ButtonWidget del = ButtonWidget.builder(Text.literal("X"),
                                  b -> delete(name)).dimensions(listX + listW - 24, listY + i * 22, 24, 20).build();
                          this.addDrawableChild(sel);
                          this.addDrawableChild(del);
                          listWidgets.add(sel);
                          listWidgets.add(del);
                      }
                  }

                  private void addAccount() {
                      String n = field.getText().trim();
                      List<String> acc = Config.get().accounts;
                      if (!Accounts.valid(n)) {
                          status = "Nama: 1-16 karakter (huruf, angka, _)";
                          return;
                      }
                      if (acc.size() >= 500) {
                          status = "Maksimal 500 akun";
                          return;
                      }
                      for (String a : acc) {
                          if (a.equalsIgnoreCase(n)) {
                              status = "Akun sudah ada";
                              return;
                          }
                      }
                      acc.add(n);
                      Config.save();
                      status = "Ditambahkan: " + n;
                      field.setText("");
                      filter = "";
                      rebuildList();
                  }

                  private void delete(String name) {
                      Config.get().accounts.remove(name);
                      Config.save();
                      status = "Dihapus: " + name;
                      rebuildList();
                  }

                  private void select(String name) {
                      try {
                          Accounts.switchTo(name);
                          this.close();
                      } catch (Throwable t) {
                          status = "Gagal: " + t.getMessage();
                      }
                  }

                  @Override
                  public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                      super.render(context, mouseX, mouseY, delta);
                      context.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, 10, 0xFFFFFFFF);
                      context.drawCenteredTextWithShadow(this.textRenderer,
                              Text.literal(pageText + "  |  " + Config.get().accounts.size() + "/500 akun"),
                              this.width / 2, listY + 5 * 22 + 6, 0xFFAAAAAA);
                      if (!status.isEmpty()) {
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal(status),
                                  this.width / 2, this.height - 12, 0xFFFFFF55);
                      }
                  }

                  @Override
                  public void close() {
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }
              }

              private static final class RangeSlider extends SliderWidget {
                  private final String label;
                  private final int min;
                  private final int max;
                  private final IntConsumer setter;

                  RangeSlider(int x, int y, int width, int height, String label, int min, int max, int value, IntConsumer setter) {
                      super(x, y, width, height, Text.empty(), (value - min) / (double) (max - min));
                      this.label = label;
                      this.min = min;
                      this.max = max;
                      this.setter = setter;
                      this.updateMessage();
                  }

                  private int current() {
                      return this.min + (int) Math.round(this.value * (this.max - this.min));
                  }

                  @Override
                  protected void updateMessage() {
                      String l = this.label == null ? "" : this.label;
                      this.setMessage(Text.literal(l + ": " + current() + "%"));
                  }

                  @Override
                  protected void applyValue() {
                      if (this.setter != null) {
                          this.setter.accept(current());
                      }
                  }
              }

              // ------------------------------------------------------------------
              // Skin: baca file .png (64x64) dari config/transparent-skin/skins
              // ------------------------------------------------------------------
              public static final class Skins {
                  public static final class Loaded {
                      public final String name;
                      public final Identifier id;

                      Loaded(String name, Identifier id) {
                          this.name = name;
                          this.id = id;
                      }
                  }

                  public static final List<Loaded> ALL = new ArrayList<>();
                  public static String error = "";
                  private static LoadedEntityModels models;
                  private static Identifier cachedId;
                  private static SkinTextures cachedBase;
                  private static SkinTextures cachedResult;

                  private Skins() {
                  }

                  public static Path dir() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin").resolve("skins");
                  }

                  public static LoadedEntityModels models() {
                      if (models == null) {
                          models = LoadedEntityModels.copy();
                      }
                      return models;
                  }

                  public static void reload() {
                      ALL.clear();
                      error = "";
                      CACHE.clear();
                      try {
                          Files.createDirectories(dir());
                      } catch (Throwable t) {
                          error = String.valueOf(t);
                      }
                      try (Stream<Path> st = Files.list(dir())) {
                          List<Path> files = new ArrayList<>();
                          st.forEach(files::add);
                          files.sort((a, b) -> a.getFileName().toString().compareToIgnoreCase(b.getFileName().toString()));
                          for (Path p : files) {
                              String fn = p.getFileName().toString();
                              if (!fn.toLowerCase().endsWith(".png")) {
                                  continue;
                              }
                              String base = fn.substring(0, fn.length() - 4);
                              try (InputStream in = Files.newInputStream(p)) {
                                  NativeImage img = NativeImage.read(in);
                                  if (img.getWidth() != 64 || img.getHeight() != 64) {
                                      img.close();
                                      throw new IllegalStateException("skin harus 64x64");
                                  }
                                  String key = base.toLowerCase().replaceAll("[^a-z0-9_.-]", "_");
                                  Identifier id = Identifier.of("transparentskin", "skin/" + key);
                                  final String texName = "transparentskin_skin_" + key;
                                  NativeImageBackedTexture tex = new NativeImageBackedTexture(() -> texName, img);
                                  MinecraftClient.getInstance().getTextureManager().registerTexture(id, tex);
                                  ALL.add(new Loaded(base, id));
                              } catch (Throwable t) {
                                  error = fn + ": " + t.getMessage();
                              }
                          }
                      } catch (Throwable t) {
                          error = String.valueOf(t);
                      }
                  }

                  public static Identifier selectedId() {
                      String sel = Config.get().selectedSkin;
                      if (sel == null || sel.isEmpty()) {
                          return null;
                      }
                      for (Loaded l : ALL) {
                          if (l.name.equals(sel)) {
                              return l.id;
                          }
                      }
                      return null;
                  }

                  private static final Map<String, SkinTextures> CACHE = new HashMap<>();

                  public static void clearCache() {
                      CACHE.clear();
                  }

                  public static SkinTextures defaultBase() {
                      String name = Accounts.currentName();
                      UUID uuid = UUID.nameUUIDFromBytes(("OfflinePlayer:" + name).getBytes(StandardCharsets.UTF_8));
                      return DefaultSkinHelper.getSkinTextures(uuid);
                  }

                  /** model skin: pilihan user (wide/slim) kalau ada, kalau belum ikut model akun */
                  public static boolean isSlim(String name, SkinTextures base) {
                      Boolean v = Config.get().skinSlim.get(name);
                      if (v != null) {
                          return v;
                      }
                      return base != null && base.model() == PlayerSkinType.SLIM;
                  }

                  private static SkinTextures build(String name, Identifier id, SkinTextures base) {
                      PlayerSkinType model = isSlim(name, base) ? PlayerSkinType.SLIM : PlayerSkinType.WIDE;
                      String key = name + "|" + System.identityHashCode(base) + "|" + model;
                      SkinTextures cached = CACHE.get(key);
                      if (cached != null) {
                          return cached;
                      }
                      final Identifier f = id;
                      AssetInfo.TextureAsset body = new AssetInfo.TextureAsset() {
                          @Override
                          public Identifier id() {
                              return f;
                          }

                          @Override
                          public Identifier texturePath() {
                              return f;
                          }
                      };
                      SkinTextures result = SkinTextures.create(body, base.cape(), base.elytra(), model);
                      if (CACHE.size() > 200) {
                          CACHE.clear();
                      }
                      CACHE.put(key, result);
                      return result;
                  }

                  /** ganti texture body dengan skin pilihan; cape tetap dari akun */
                  public static SkinTextures apply(SkinTextures base) {
                      Identifier id = selectedId();
                      if (id == null || base == null) {
                          return base;
                      }
                      return build(Config.get().selectedSkin, id, base);
                  }

                  public static SkinTextures texturesFor(String name) {
                      SkinTextures base = defaultBase();
                      if (name == null || name.isEmpty()) {
                          return base;
                      }
                      for (Loaded l : ALL) {
                          if (l.name.equals(name)) {
                              return build(name, l.id, base);
                          }
                      }
                      return base;
                  }

                  public static SkinTextures previewTextures() {
                      return texturesFor(Config.get().selectedSkin);
                  }
              }

              public static final class WardrobeScreen extends Screen {
                  private static final int BLUE = 0xFF1F4E8C;
                  private static final int BLUE_HOVER = 0xFF2B63AE;

                  private static final class Btn {
                      final int x;
                      final int y;
                      final int w;
                      final int h;
                      final String label;
                      final int style; // 0 gelap, 1 biru, 2 ikon cari, 3 tombol Wide, 4 tombol Slim

                      Btn(int x, int y, int w, int h, String label, int style) {
                          this.x = x;
                          this.y = y;
                          this.w = w;
                          this.h = h;
                          this.label = label;
                          this.style = style;
                      }
                  }

                  private static final class Card {
                      final int x;
                      final int y;
                      final int w;
                      final int h;
                      final String label;
                      final String sub;
                      final boolean selected;

                      Card(int x, int y, int w, int h, String label, String sub, boolean selected) {
                          this.x = x;
                          this.y = y;
                          this.w = w;
                          this.h = h;
                          this.label = label;
                          this.sub = sub;
                          this.selected = selected;
                      }
                  }

                  private final Screen parent;
                  private int tab = 0; // 0 skin, 1 cosmetic
                  private int pageIdx = 0;
                  private int pageCount = 1;
                  private boolean searching = false;
                  private String filter = "";
                  private String status = "";
                  private TextFieldWidget searchField;
                  private int px;
                  private int py;
                  private int pw;
                  private int ph;
                  private int sideW;
                  private int centerW;
                  private int cx0;
                  private int rx;
                  private int rw;
                  private int gx;
                  private int gy;
                  private int cardW;
                  private int cardH;
                  private int rowH;
                  private int per;
                  private final List<Btn> btns = new ArrayList<>();
                  private final List<Card> cards = new ArrayList<>();
                  private final List<ClickableWidget> dyn = new ArrayList<>();

                  public WardrobeScreen(Screen parent) {
                      super(Text.literal("Wardrobe"));
                      this.parent = parent;
                  }

                  private ButtonWidget addClick(int x, int y, int w, int h, Runnable r) {
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> r.run()).dimensions(x, y, w, h).build();
                      b.setAlpha(0f);
                      this.addDrawableChild(b);
                      return b;
                  }

                  @Override
                  protected void init() {
                      btns.clear();
                      cards.clear();
                      dyn.clear();
                      pw = Math.min(this.width - 8, 560);
                      ph = Math.min(this.height - 8, 300);
                      px = (this.width - pw) / 2;
                      py = (this.height - ph) / 2;
                      sideW = 66;
                      rw = (pw - sideW) * 40 / 100;
                      centerW = pw - sideW - rw;
                      cx0 = px + sideW;
                      rx = cx0 + centerW;

                      addClick(px + 3, py + 4, 16, 16, this::close);
                      btns.add(new Btn(px + 3, py + 4, 16, 16, "<", 0));

                      addClick(px + 2, py + 30, sideW - 4, 20, () -> switchTab(0));
                      addClick(px + 2, py + 52, sideW - 4, 20, () -> switchTab(1));

                      int hx = cx0 + centerW - 6 - 16;
                      addClick(hx, py + 4, 16, 16, () -> {
                          searching = !searching;
                          if (!searching) {
                              filter = "";
                          }
                          pageIdx = 0;
                          this.clearAndInit();
                      });
                      btns.add(new Btn(hx, py + 4, 16, 16, "", 2));
                      int leftLimit = hx - 4;
                      if (tab == 0) {
                          int aw = 58;
                          int ax = hx - 4 - aw;
                          addClick(ax, py + 4, aw, 16, this::addSkin);
                          btns.add(new Btn(ax, py + 4, aw, 16, "+ Add Skin", 1));
                          leftLimit = ax - 4;
                      }
                      if (searching) {
                          searchField = new TextFieldWidget(this.textRenderer, cx0 + 6, py + 4, Math.max(40, leftLimit - (cx0 + 6)), 16, Text.literal("Cari"));
                          searchField.setPlaceholder(Text.literal("Cari..."));
                          searchField.setText(filter);
                          searchField.setChangedListener(t -> {
                              filter = t;
                              pageIdx = 0;
                              rebuildGrid();
                          });
                          this.addDrawableChild(searchField);
                      }

                      addClick(rx + 6, py + 4, 30, 16, () -> setSlim(false));
                      btns.add(new Btn(rx + 6, py + 4, 30, 16, "Wide", 3));
                      addClick(rx + 40, py + 4, 30, 16, () -> setSlim(true));
                      btns.add(new Btn(rx + 40, py + 4, 30, 16, "Slim", 4));
                      addClick(rx + 78, py + 4, 16, 16, () -> cycle(-1));
                      btns.add(new Btn(rx + 78, py + 4, 16, 16, "<", 0));
                      addClick(rx + rw - 22, py + 4, 16, 16, () -> cycle(1));
                      btns.add(new Btn(rx + rw - 22, py + 4, 16, 16, ">", 0));

                      gx = cx0 + 6;
                      gy = py + 28;
                      int gw = centerW - 12;
                      cardW = (gw - 10) / 3;
                      cardH = Math.max(36, Math.round(cardW * 1.1f));
                      rowH = cardH + 12;
                      int rows = Math.max(1, (ph - 28 - 16) / rowH);
                      per = 3 * rows;

                      int py2 = py + ph - 14;
                      addClick(cx0 + centerW - 6 - 34, py2, 16, 12, () -> page(-1));
                      btns.add(new Btn(cx0 + centerW - 6 - 34, py2, 16, 12, "<", 0));
                      addClick(cx0 + centerW - 6 - 16, py2, 16, 12, () -> page(1));
                      btns.add(new Btn(cx0 + centerW - 6 - 16, py2, 16, 12, ">", 0));

                      rebuildGrid();
                  }

                  private void switchTab(int t) {
                      tab = t;
                      pageIdx = 0;
                      filter = "";
                      searching = false;
                      this.clearAndInit();
                  }

                  private void page(int dir) {
                      pageIdx = Math.max(0, pageIdx + dir);
                      rebuildGrid();
                  }

                  private void addSkin() {
                      Skins.reload();
                      status = Skins.error.isEmpty() ? "Taruh PNG 64x64 di config/transparent-skin/skins" : Skins.error;
                      rebuildGrid();
                  }

                  private String currentSkin() {
                      String c = Config.get().selectedSkin;
                      return c == null ? "" : c;
                  }

                  private void selectSkin(String n) {
                      Config.get().selectedSkin = n;
                      Config.save();
                      rebuildGrid();
                  }

                  private void setSlim(boolean slim) {
                      String cur = currentSkin();
                      if (cur.isEmpty()) {
                          return;
                      }
                      Config.get().skinSlim.put(cur, slim);
                      Config.save();
                      Skins.clearCache();
                  }

                  private void cycle(int dir) {
                      List<String> all = new ArrayList<>();
                      all.add("");
                      for (Skins.Loaded l : Skins.ALL) {
                          all.add(l.name);
                      }
                      int idx = Math.max(0, all.indexOf(currentSkin()));
                      int next = ((idx + dir) % all.size() + all.size()) % all.size();
                      selectSkin(all.get(next));
                  }

                  private List<String> skinNames() {
                      String f = filter.toLowerCase();
                      List<String> r = new ArrayList<>();
                      if (f.isEmpty() || "default".contains(f)) {
                          r.add("");
                      }
                      for (Skins.Loaded l : Skins.ALL) {
                          if (f.isEmpty() || l.name.toLowerCase().contains(f)) {
                              r.add(l.name);
                          }
                      }
                      return r;
                  }

                  private List<Cosmetics.Loaded> cosmeticItems() {
                      String f = filter.toLowerCase();
                      List<Cosmetics.Loaded> r = new ArrayList<>();
                      for (Cosmetics.Loaded l : Cosmetics.ALL) {
                          if (f.isEmpty() || l.display.toLowerCase().contains(f)) {
                              r.add(l);
                          }
                      }
                      return r;
                  }

                  private void rebuildGrid() {
                      for (ClickableWidget w : dyn) {
                          this.remove(w);
                      }
                      dyn.clear();
                      cards.clear();
                      String cur = currentSkin();

                      if (tab == 0) {
                          List<String> names = skinNames();
                          pageCount = Math.max(1, (names.size() + per - 1) / per);
                          pageIdx = Math.min(pageIdx, pageCount - 1);
                          for (int i = 0; i < per; i++) {
                              int idx = pageIdx * per + i;
                              if (idx >= names.size()) {
                                  break;
                              }
                              String n = names.get(idx);
                              int x = gx + (i % 3) * (cardW + 5);
                              int y = gy + (i / 3) * rowH;
                              cards.add(new Card(x, y, cardW, cardH, n.isEmpty() ? "Default" : n, "", n.equals(cur)));
                              dyn.add(addClick(x, y, cardW, cardH, () -> selectSkin(n)));
                              PlayerSkinWidget sw = new PlayerSkinWidget(cardW - 6, cardH - 6, Skins.models(), () -> Skins.texturesFor(n));
                              sw.setPosition(x + 3, y + 3);
                              this.addDrawableChild(sw);
                              dyn.add(sw);
                          }
                      } else {
                          List<Cosmetics.Loaded> items = cosmeticItems();
                          pageCount = Math.max(1, (items.size() + per - 1) / per);
                          pageIdx = Math.min(pageIdx, pageCount - 1);
                          for (int i = 0; i < per; i++) {
                              int idx = pageIdx * per + i;
                              if (idx >= items.size()) {
                                  break;
                              }
                              Cosmetics.Loaded l = items.get(idx);
                              int x = gx + (i % 3) * (cardW + 5);
                              int y = gy + (i / 3) * rowH;
                              cards.add(new Card(x, y, cardW, cardH, l.display, Cosmetics.SLOT_LABELS[l.slot], Cosmetics.isSelected(l)));
                              dyn.add(addClick(x, y, cardW, cardH, () -> {
                                  Cosmetics.toggle(l);
                                  rebuildGrid();
                              }));
                          }
                      }

                      PlayerSkinWidget big = new PlayerSkinWidget(Math.max(40, rw - 16), Math.max(60, ph - 34), Skins.models(),
                              () -> Skins.texturesFor(Config.get().selectedSkin));
                      big.setPosition(rx + 8, py + 28);
                      this.addDrawableChild(big);
                      dyn.add(big);
                  }

                  private static void border(DrawContext ctx, int x, int y, int w, int h, int color) {
                      ctx.fill(x, y, x + w, y + 1, color);
                      ctx.fill(x, y + h - 1, x + w, y + h, color);
                      ctx.fill(x, y, x + 1, y + h, color);
                      ctx.fill(x + w - 1, y, x + w, y + h, color);
                  }

                  private void centerText(DrawContext ctx, String text, int x, int y, int w, int h, int color) {
                      int tw = this.textRenderer.getWidth(text);
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal(text), x + (w - tw) / 2, y + (h - 8) / 2, color);
                  }

                  private void drawAll(DrawContext ctx, int mx, int my) {
                      ctx.fill(0, 0, this.width, this.height, 0xFF121212);
                      ctx.fill(px, py, px + pw, py + ph, 0xFF1B1B1B);
                      border(ctx, px, py, pw, ph, 0xFF2E2E2E);
                      ctx.fill(px, py, px + sideW, py + ph, 0xFF181818);
                      ctx.fill(cx0, py, cx0 + centerW, py + 24, 0xFF202020);
                      ctx.fill(rx, py, rx + rw, py + 24, 0xFF202020);
                      ctx.fill(px, py + 24, px + sideW, py + 25, 0xFF2E2E2E);
                      ctx.fill(cx0, py, cx0 + 1, py + ph, 0xFF2E2E2E);
                      ctx.fill(rx, py, rx + 1, py + ph, 0xFF2E2E2E);

                      // sidebar
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal("Wardrobe"), px + 22, py + 8, 0xFFFFFFFF);
                      if (tab == 0) {
                          ctx.fill(px + 2, py + 30, px + sideW - 2, py + 50, 0xFF262626);
                      } else {
                          ctx.fill(px + 2, py + 52, px + sideW - 2, py + 72, 0xFF262626);
                      }
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal("Skins \u2605"), px + 8, py + 36, 0xFFE79BEA);
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal("Cosmetics"), px + 8, py + 58, 0xFFFFE04A);

                      // judul tengah / kanan
                      if (!searching) {
                          String head = tab == 0 ? "Skins [" + Skins.ALL.size() + "/128]" : "Cosmetics [" + Cosmetics.ALL.size() + "]";
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal(head), cx0 + 8, py + 8, 0xFFFFFFFF);
                      }
                      String cur = currentSkin();
                      String shown = cur.isEmpty() ? "Default" : cur;
                      shown = this.textRenderer.trimToWidth(shown, Math.max(20, rw - 78 - 22 - 24));
                      centerText(ctx, shown, rx + 96, py + 4, Math.max(20, rw - 78 - 22 - 20), 16, 0xFFFFFFFF);

                      // tombol
                      boolean slim = Skins.isSlim(cur, Skins.defaultBase());
                      for (Btn b : btns) {
                          boolean hover = mx >= b.x && mx < b.x + b.w && my >= b.y && my < b.y + b.h;
                          boolean disabled = false;
                          boolean active = false;
                          if (b.style == 3 || b.style == 4) {
                              disabled = cur.isEmpty();
                              active = !disabled && ((b.style == 4) == slim);
                          }
                          int bg;
                          if (b.style == 1 || active) {
                              bg = hover ? BLUE_HOVER : BLUE;
                          } else {
                              bg = hover ? 0xFF3A3A3A : 0xFF2A2A2A;
                          }
                          ctx.fill(b.x, b.y, b.x + b.w, b.y + b.h, bg);
                          if (!(b.style == 1 || active)) {
                              border(ctx, b.x, b.y, b.w, b.h, 0xFF3E3E3E);
                          }
                          if (b.style == 2) {
                              art(ctx, b.x + 4, b.y + 4, new String[]{
                                      ".###...", "#...#..", "#...#..", "#...#..", ".###...", ".....#.", "......#"});
                          } else if (!b.label.isEmpty()) {
                              centerText(ctx, b.label, b.x, b.y, b.w, b.h, disabled ? 0xFF777777 : 0xFFFFFFFF);
                          }
                      }

                      // kartu
                      for (Card c : cards) {
                          boolean hover = mx >= c.x && mx < c.x + c.w && my >= c.y && my < c.y + c.h;
                          ctx.fill(c.x, c.y, c.x + c.w, c.y + c.h, hover ? 0xFF282828 : 0xFF1E1E1E);
                          ctx.fill(c.x, c.y + c.h - 2, c.x + c.w, c.y + c.h, c.selected ? 0xFFFFFFFF : 0xFF6E6E6E);
                          if (c.selected) {
                              border(ctx, c.x, c.y, c.w, c.h, tab == 1 ? BLUE_HOVER : 0xFFE6E6E6);
                          }
                          if (!c.sub.isEmpty()) {
                              centerText(ctx, this.textRenderer.trimToWidth(c.sub, c.w - 4), c.x, c.y, c.w, c.h, 0xFFAAAAAA);
                          }
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal(this.textRenderer.trimToWidth(c.label, c.w)),
                                  c.x, c.y + c.h + 3, 0xFFFFFFFF);
                      }

                      // status + halaman
                      if (!status.isEmpty()) {
                          String st = this.textRenderer.trimToWidth(status, centerW - 70);
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal(st), cx0 + 6, py + ph - 12, 0xFFFFFF77);
                      }
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal((pageIdx + 1) + "/" + pageCount),
                              cx0 + centerW - 6 - 34 - 26, py + ph - 12, 0xFFAAAAAA);
                      if (tab == 1 && Cosmetics.ALL.isEmpty()) {
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal("Taruh .bbmodel di config/transparent-skin/cosmetics"),
                                  cx0 + 6, py + 30, 0xFFAAAAAA);
                      }
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                      // digambar manual di drawAll
                  }

                  @Override
                  public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                      drawAll(context, mouseX, mouseY);
                      super.render(context, mouseX, mouseY, delta);
                  }

                  @Override
                  public boolean shouldPause() {
                      return false;
                  }

                  @Override
                  public void close() {
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }

                  @Override
                  public void removed() {
                      Config.save();
                      super.removed();
                  }
              }

              // ------------------------------------------------------------------
              // Inventory sorter: rapikan slot inventory utama (9..35) dengan satu klik
              // ------------------------------------------------------------------
              public static final class InvSorter {
                  private static final int FIRST = 9;
                  private static final int COUNT = 27;

                  private InvSorter() {
                  }

                  public static void sort(MinecraftClient mc) {
                      ClientPlayerEntity player = mc.player;
                      if (player == null || mc.interactionManager == null) {
                          return;
                      }
                      int syncId = player.currentScreenHandler.syncId;
                      for (int guard = 0; guard < 400; guard++) {
                          List<ItemStack> target = targetLayout(player);
                          int move = -1;
                          int from = -1;
                          for (int p = 0; p < COUNT; p++) {
                              ItemStack want = target.get(p);
                              ItemStack cur = player.getInventory().getStack(FIRST + p);
                              if (sameStack(cur, want)) {
                                  continue;
                              }
                              if (want.isEmpty()) {
                                  break;
                              }
                              for (int q = p + 1; q < COUNT && from < 0; q++) {
                                  if (sameStack(player.getInventory().getStack(FIRST + q), want)) {
                                      from = q;
                                  }
                              }
                              for (int q = p + 1; q < COUNT && from < 0; q++) {
                                  if (sameItem(player.getInventory().getStack(FIRST + q), want)) {
                                      from = q;
                                  }
                              }
                              if (from >= 0) {
                                  move = p;
                              }
                              break;
                          }
                          if (move < 0) {
                              return;
                          }
                          // ambil dari sumber, taruh di tujuan (tukar/gabung), lalu kembalikan sisa ke sumber
                          click(mc, syncId, FIRST + from);
                          click(mc, syncId, FIRST + move);
                          click(mc, syncId, FIRST + from);
                      }
                  }

                  private static void click(MinecraftClient mc, int syncId, int slot) {
                      mc.interactionManager.clickSlot(syncId, slot, 0, SlotActionType.PICKUP, mc.player);
                  }

                  private static List<ItemStack> targetLayout(ClientPlayerEntity player) {
                      List<ItemStack> list = new ArrayList<>();
                      for (int i = 0; i < COUNT; i++) {
                          ItemStack s = player.getInventory().getStack(FIRST + i);
                          if (!s.isEmpty()) {
                              list.add(s.copy());
                          }
                      }
                      list.sort(Comparator
                              .comparing((ItemStack s) -> Registries.ITEM.getId(s.getItem()).toString())
                              .thenComparing(Comparator.comparingInt(ItemStack::getCount).reversed()));
                      while (list.size() < COUNT) {
                          list.add(ItemStack.EMPTY);
                      }
                      return list;
                  }

                  private static boolean sameStack(ItemStack a, ItemStack b) {
                      if (a.isEmpty() || b.isEmpty()) {
                          return a.isEmpty() && b.isEmpty();
                      }
                      return ItemStack.areItemsAndComponentsEqual(a, b) && a.getCount() == b.getCount();
                  }

                  private static boolean sameItem(ItemStack a, ItemStack b) {
                      return !a.isEmpty() && !b.isEmpty() && a.getItem() == b.getItem();
                  }
              }

              // ------------------------------------------------------------------
              // Toggle sprint + HUD status (Sprint [toggled] dan indikator shield)
              // ------------------------------------------------------------------
              public static final class HudExtras {
                  private static KeyBinding toggleKey;
                  public static boolean sprintToggled = false;

                  private HudExtras() {
                  }

                  public static void init() {
                      toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                              "key.transparentskin.toggle_sprint",
                              InputUtil.Type.KEYSYM,
                              GLFW.GLFW_KEY_R,
                              KeyBinding.Category.MISC));

                      HudRenderCallback.EVENT.register((ctx, tickDelta) -> {
                          try {
                              render(ctx, tickDelta);
                          } catch (Throwable ignored) {
                          }
                      });
                  }

                  public static void tick(MinecraftClient mc) {
                      while (toggleKey != null && toggleKey.wasPressed()) {
                          sprintToggled = !sprintToggled;
                      }
                      if (mc.player == null || mc.currentScreen != null) {
                          return;
                      }
                      boolean canSprint = sprintToggled
                              && mc.options.forwardKey.isPressed()
                              && !mc.player.isSneaking()
                              && mc.player.getHungerManager().getFoodLevel() > 6;
                      if (canSprint) {
                          mc.player.setSprinting(true);
                      } else if (sprintToggled && !mc.options.forwardKey.isPressed()) {
                          mc.player.setSprinting(false);
                      }
                  }

                  private static void render(DrawContext ctx, RenderTickCounter tickCounter) {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (mc.player == null || mc.options.hudHidden) {
                          return;
                      }
                      int sh = ctx.getScaledWindowHeight();
                      float delta = tickCounter.getTickProgress(true);

                      // indikator shield di kiri bawah (di atas tulisan sprint)
                      ItemStack shield = null;
                      if (mc.player.getMainHandStack().isOf(Items.SHIELD)) {
                          shield = mc.player.getMainHandStack();
                      } else if (mc.player.getOffHandStack().isOf(Items.SHIELD)) {
                          shield = mc.player.getOffHandStack();
                      }
                      int bottomY = sh - 12;
                      if (sprintToggled) {
                          ctx.drawTextWithShadow(mc.textRenderer, Text.literal("Sprint [toggled]"), 4, bottomY, 0xFFFFFFFF);
                      }
                      if (shield != null) {
                          int color;
                          if (mc.player.getItemCooldownManager().isCoolingDown(shield)) {
                              float remain = mc.player.getItemCooldownManager().getCooldownProgress(shield, delta);
                              color = remain > 0.4f ? 0xFFE53935 : 0xFFFFA726;
                          } else {
                              color = 0xFF43A047;
                          }
                          int x = 4;
                          int y = bottomY - 22;
                          // outline tipis, isi item tetap terlihat
                          ctx.fill(x - 1, y - 1, x + 17, y, color);
                          ctx.fill(x - 1, y + 16, x + 17, y + 17, color);
                          ctx.fill(x - 1, y, x, y + 16, color);
                          ctx.fill(x + 16, y, x + 17, y + 16, color);
                          ctx.drawItem(shield, x, y);
                      }
                  }
              }

              // ------------------------------------------------------------------
              // Slider opacity (0 - 100 %)
              // ------------------------------------------------------------------
              private static final class OpacitySlider extends SliderWidget {
                  private final String label;
                  private final IntConsumer setter;

                  OpacitySlider(int x, int y, int width, int height, String label, int percent, IntConsumer setter) {
                      super(x, y, width, height, Text.empty(), percent / 100.0);
                      this.label = label;
                      this.setter = setter;
                      this.updateMessage();
                  }

                  @Override
                  protected void updateMessage() {
                      String l = this.label == null ? "" : this.label;
                      this.setMessage(Text.literal(l + ": " + (int) Math.round(this.value * 100.0) + "%"));
                  }

                  @Override
                  protected void applyValue() {
                      if (this.setter != null) {
                          this.setter.accept((int) Math.round(this.value * 100.0));
                      }
                  }
              }
          }
