          package com.vizkovico.transparentskin.mixin;

          import com.vizkovico.transparentskin.TransparentSkinMod;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.render.entity.model.PlayerEntityModel;
          import net.minecraft.client.render.entity.state.PlayerEntityRenderState;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(PlayerEntityModel.class)
          public abstract class PlayerEntityModelMixin {

              @Inject(
                      method = "setAngles(Lnet/minecraft/client/render/entity/state/PlayerEntityRenderState;)V",
                      at = @At("TAIL"),
                      require = 0
              )
              private void ts$afterSetAngles(PlayerEntityRenderState state, CallbackInfo ci) {
                  try {
                      PlayerEntityModel m = (PlayerEntityModel) (Object) this;

                      // base layer
                      TransparentSkinMod.State.tag(m.head, 1);
                      TransparentSkinMod.State.tag(m.body, 2);
                      TransparentSkinMod.State.tag(m.rightArm, 3);
                      TransparentSkinMod.State.tag(m.leftArm, 4);
                      TransparentSkinMod.State.tag(m.rightLeg, 5);
                      TransparentSkinMod.State.tag(m.leftLeg, 6);

                      // outer layer
                      TransparentSkinMod.State.tag(m.hat, 11);
                      TransparentSkinMod.State.tag(m.jacket, 12);
                      TransparentSkinMod.State.tag(m.rightSleeve, 13);
                      TransparentSkinMod.State.tag(m.leftSleeve, 14);
                      TransparentSkinMod.State.tag(m.rightPants, 15);
                      TransparentSkinMod.State.tag(m.leftPants, 16);

                      MinecraftClient mc = MinecraftClient.getInstance();
                      boolean self = mc != null && mc.player != null && state.id == mc.player.getId();

                      TransparentSkinMod.Config c = TransparentSkinMod.Config.get();
                      TransparentSkinMod.State.active = c.enabled && (c.everyone || self);
                      TransparentSkinMod.State.selfNow = self;

                      if (TransparentSkinMod.State.angleHits < 1000000) {
                          TransparentSkinMod.State.angleHits++;
                      }
                  } catch (Throwable t) {
                      TransparentSkinMod.State.active = false;
                  }
              }
          }
