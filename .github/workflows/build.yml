name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Generate project files
        run: |
          cat > settings.gradle <<'TS_EOF_0'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'transparent-skin'
          TS_EOF_0
          cat > build.gradle <<'TS_EOF_1'
          plugins {
              id 'fabric-loom' version '1.11-SNAPSHOT'
          }

          version = '1.0.0'
          group = 'com.vizkovico'

          base {
              archivesName = 'transparent-skin'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.10"
              mappings "net.fabricmc:yarn:1.21.10+build.3:v2"
              modImplementation "net.fabricmc:fabric-loader:0.17.2"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          TS_EOF_1
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'TS_EOF_2'
          {
            "schemaVersion": 1,
            "id": "transparentskin",
            "version": "${version}",
            "name": "Transparent Skin",
            "description": "Skin transparan (opacity bisa diatur), hide bagian badan, dan cosmetic dari file Blockbench. Buka menu dengan /ts",
            "authors": ["Anonymous"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.vizkovico.transparentskin.TransparentSkinMod"]
            },
            "mixins": ["transparentskin.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          TS_EOF_2
          mkdir -p src/main/resources
          cat > src/main/resources/transparentskin.mixins.json <<'TS_EOF_3'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.vizkovico.transparentskin.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [],
            "client": [
              "ModelPartMixin",
              "PlayerEntityModelMixin",
              "ScreenInvoker",
              "AbstractClientPlayerEntityMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          TS_EOF_3
          mkdir -p src/main/java/com/vizkovico/transparentskin
          cat > src/main/java/com/vizkovico/transparentskin/TransparentSkinMod.java <<'TS_EOF_4'
          package com.vizkovico.transparentskin;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.JsonArray;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import com.mojang.authlib.GameProfile;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.LivingEntityFeatureRendererRegistrationCallback;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.item.ItemStack;
          import net.minecraft.registry.Registries;
          import net.minecraft.screen.slot.SlotActionType;
          import java.util.Comparator;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.item.Items;
          import org.lwjgl.glfw.GLFW;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.gui.PlayerSkinDrawer;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.ingame.InventoryScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.ClickableWidget;
          import net.minecraft.client.gui.widget.PlayerSkinWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.client.model.Dilation;
          import net.minecraft.client.model.ModelData;
          import net.minecraft.client.model.ModelPart;
          import net.minecraft.client.model.ModelPartBuilder;
          import net.minecraft.client.model.ModelPartData;
          import net.minecraft.client.model.ModelTransform;
          import net.minecraft.client.model.TexturedModelData;
          import net.minecraft.client.session.Session;
          import net.minecraft.client.render.entity.model.LoadedEntityModels;
          import net.minecraft.client.util.DefaultSkinHelper;
          import net.minecraft.entity.player.PlayerSkinType;
          import net.minecraft.entity.player.SkinTextures;
          import net.minecraft.util.AssetInfo;
          import net.minecraft.client.render.OverlayTexture;
          import net.minecraft.client.render.RenderLayer;
          import net.minecraft.client.render.command.OrderedRenderCommandQueue;
          import net.minecraft.client.render.entity.PlayerEntityRenderer;
          import net.minecraft.client.render.entity.feature.FeatureRenderer;
          import net.minecraft.client.render.entity.feature.FeatureRendererContext;
          import net.minecraft.client.render.entity.model.EntityModel;
          import net.minecraft.client.render.entity.model.PlayerEntityModel;
          import net.minecraft.client.render.entity.state.PlayerEntityRenderState;
          import net.minecraft.client.texture.NativeImage;
          import net.minecraft.client.texture.NativeImageBackedTexture;
          import net.minecraft.client.util.math.MatrixStack;
          import com.vizkovico.transparentskin.mixin.ScreenInvoker;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;

          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.io.Reader;
          import java.lang.reflect.Field;
          import java.lang.reflect.Modifier;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.Base64;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Optional;
          import java.util.UUID;
          import java.util.function.IntConsumer;
          import java.util.function.Supplier;
          import java.util.stream.Stream;

          public class TransparentSkinMod implements ClientModInitializer {

              private static boolean openRequested = false;

              @Override
              public void onInitializeClient() {
                  Config.load();

                  ClientLifecycleEvents.CLIENT_STARTED.register(client -> {
                      Cosmetics.reload();
                      Skins.reload();
                      try {
                          String cur = Config.get().currentAccount;
                          if (cur != null && !cur.isEmpty()) {
                              Accounts.switchTo(cur);
                          }
                      } catch (Throwable ignored) {
                      }
                  });

                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {
                      String[] names = {"ts", "tskin"};
                      for (String name : names) {
                          dispatcher.register(
                                  ClientCommandManager.literal(name)
                                          .executes(ctx -> {
                                              openRequested = true;
                                              return 1;
                                          })
                                          .then(ClientCommandManager.literal("toggle").executes(ctx -> {
                                              Config c = Config.get();
                                              c.enabled = !c.enabled;
                                              Config.save();
                                              ctx.getSource().sendFeedback(Text.literal("Skin transparan: " + (c.enabled ? "ON" : "OFF")));
                                              return 1;
                                          }))
                          );
                      }
                  });

                  // GUI dibuka di tick berikutnya, supaya tidak langsung ketutup oleh chat screen
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      try {
                          HudExtras.tick(client);
                      } catch (Throwable ignored) {
                      }
                      if (openRequested) {
                          openRequested = false;
                          client.setScreen(new ConfigScreen(null));
                      }
                  });

                  HudExtras.init();

                  // Daftarkan layer cosmetic ke renderer player
                  LivingEntityFeatureRendererRegistrationCallback.EVENT.register((entityType, entityRenderer, registrationHelper, context) -> {
                      try {
                          if (entityRenderer instanceof PlayerEntityRenderer) {
                              @SuppressWarnings("unchecked")
                              FeatureRendererContext<PlayerEntityRenderState, PlayerEntityModel> ctx =
                                      (FeatureRendererContext<PlayerEntityRenderState, PlayerEntityModel>) (Object) entityRenderer;
                              registrationHelper.register(new CosmeticFeature(ctx));
                          }
                      } catch (Throwable t) {
                          Cosmetics.error = String.valueOf(t);
                      }
                  });

                  // Tombol + preview di main menu dan pause menu (posisi mengikuti gambar referensi)
                  ScreenEvents.AFTER_INIT.register((client, screen, scaledWidth, scaledHeight) -> {
                      try {
                          buildMenuUi(client, screen, scaledWidth, scaledHeight);
                          if (screen instanceof InventoryScreen) {
                              addSorterButton(client, screen, scaledWidth, scaledHeight);
                          }
                      } catch (Throwable t) {
                          Cosmetics.error = String.valueOf(t);
                      }
                  });
              }

              private static void addSorterButton(MinecraftClient client, Screen screen, int sw, int sh) {
                  int left = (sw - 176) / 2;
                  int top = (sh - 166) / 2;
                  int bx = left + 158;
                  int by = top + 4;
                  addWidget(screen, ButtonWidget.builder(Text.empty(), btn -> InvSorter.sort(client))
                          .dimensions(bx, by, 12, 12).build());
                  ScreenEvents.afterRender(screen).register((s2, ctx, mx, my, td) -> {
                      try {
                          boolean hover = mx >= bx && mx < bx + 12 && my >= by && my < by + 12;
                          ctx.fill(bx, by, bx + 12, by + 12, hover ? 0xFF3E3E44 : 0xFF2B2B30);
                          ctx.fill(bx, by, bx + 12, by + 1, 0xFF58585E);
                          ctx.fill(bx + 2, by + 3, bx + 10, by + 4, 0xFFE8E8E8);
                          ctx.fill(bx + 2, by + 6, bx + 8, by + 7, 0xFFE8E8E8);
                          ctx.fill(bx + 2, by + 9, bx + 6, by + 10, 0xFFE8E8E8);
                      } catch (Throwable ignored) {
                      }
                  });
              }

              private static void addWidget(Screen screen, ClickableWidget widget) {
                  ((ScreenInvoker) (Object) screen).ts$addDrawableChild(widget);
              }

              private static final int ICON_NONE = 0;
              private static final int ICON_SLIDERS = 1;
              private static final int ICON_SHIRT = 2;
              private static final int ICON_FOLDER = 3;
              private static final int ICON_HEAD = 4;
              private static final int ICON_ARROW = 5;

              private static final class Spec {
                  final int x;
                  final int y;
                  final int w;
                  final int h;
                  final String label;
                  final int icon;
                  final Runnable action;

                  Spec(int x, int y, int w, int h, String label, int icon, Runnable action) {
                      this.x = x;
                      this.y = y;
                      this.w = w;
                      this.h = h;
                      this.label = label;
                      this.icon = icon;
                      this.action = action;
                  }
              }

              /** kotak preview: {x1, y1, x2, y2} dari slider posisi X/Y dan ukuran */
              private static int[] previewBox(int sw, int sh) {
                  Config c = Config.get();
                  int h = Math.max(40, Math.round(127f / 360f * sh * c.previewSize / 100f));
                  int w = Math.max(26, Math.round(h * 0.65f));
                  int cx = Math.round(sw * c.previewX / 100f);
                  int cy = Math.round(sh * c.previewY / 100f);
                  return new int[]{cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2};
              }

              private static void buildMenuUi(MinecraftClient client, Screen screen, int sw, int sh) {
                  boolean title = screen instanceof TitleScreen;
                  boolean pause = screen instanceof GameMenuScreen;
                  if (!title && !pause) {
                      return;
                  }
                  int[] b = previewBox(sw, sh);
                  int cx = (b[0] + b[2]) / 2;
                  int margin = Math.round(58f / 640f * sw);
                  int rightX = sw - margin - 80;
                  List<Spec> specs = new ArrayList<>();

                  // Wardrobe: di bawah preview
                  int wardW = 80;
                  int wardX = Math.max(4, Math.min(sw - wardW - 4, cx - wardW / 2));
                  int wardY = Math.min(sh - 24, b[3] + Math.round(32f / 360f * sh));
                  specs.add(new Spec(wardX, wardY, wardW, 20, "Wardrobe", ICON_SHIRT,
                          () -> client.setScreen(new WardrobeScreen(screen))));

                  // Setting mod (kanan) + tombol folder di kirinya
                  int setY = Math.round(222f / 360f * sh);
                  specs.add(new Spec(rightX, setY, 80, 20, "Settings", ICON_SLIDERS,
                          () -> client.setScreen(new ConfigScreen(screen))));
                  specs.add(new Spec(rightX - 23, setY, 19, 20, "", ICON_FOLDER,
                          () -> client.setScreen(new ConfigScreen(screen, 2))));

                  if (title) {
                      // Akun: kiri atas
                      int ay = Math.round(38f / 360f * sh);
                      String name = Accounts.currentName();
                      if (name.length() > 10) {
                          name = name.substring(0, 9) + "..";
                      }
                      specs.add(new Spec(margin, ay, 79, 20, name, ICON_HEAD,
                              () -> client.setScreen(new AccountScreen(screen))));
                      specs.add(new Spec(margin + 80, ay, 13, 20, "", ICON_ARROW,
                              () -> client.setScreen(new AccountScreen(screen))));

                      // Preview karakter di main menu
                      PlayerSkinWidget skin = new PlayerSkinWidget(b[2] - b[0], b[3] - b[1], Skins.models(), Skins::previewTextures);
                      skin.setPosition(b[0], b[1]);
                      addWidget(screen, skin);
                  }

                  for (Spec sp : specs) {
                      addWidget(screen, ButtonWidget.builder(Text.empty(), btn -> sp.action.run())
                              .dimensions(sp.x, sp.y, sp.w, sp.h).build());
                  }

                  ScreenEvents.afterRender(screen).register((s2, ctx, mx, my, td) -> {
                      try {
                          for (Spec sp : specs) {
                              drawSpec(ctx, sp, mx, my);
                          }
                          if (pause) {
                              drawPreview(ctx, s2.width, s2.height, mx, my);
                          }
                      } catch (Throwable t) {
                          Cosmetics.error = String.valueOf(t);
                      }
                  });
              }

              private static void drawPreview(DrawContext context, int sw, int sh, int mouseX, int mouseY) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.player == null) {
                      return;
                  }
                  int[] b = previewBox(sw, sh);
                  InventoryScreen.drawEntity(context, b[0], b[1], b[2], b[3], (int) ((b[3] - b[1]) * 0.43f), 0.0625f, mouseX, mouseY, mc.player);
              }

              private static void art(DrawContext ctx, int x, int y, String[] rows) {
                  for (int r = 0; r < rows.length; r++) {
                      for (int c = 0; c < rows[r].length(); c++) {
                          char ch = rows[r].charAt(c);
                          int color;
                          switch (ch) {
                              case '#':
                                  color = 0xFFE8E8E8;
                                  break;
                              case 'h':
                                  color = 0xFF5B3A1F;
                                  break;
                              case 's':
                                  color = 0xFFC8895B;
                                  break;
                              case 'b':
                                  color = 0xFF2A3B8A;
                                  break;
                              default:
                                  continue;
                          }
                          ctx.fill(x + c, y + r, x + c + 1, y + r + 1, color);
                      }
                  }
              }

              private static void drawSpec(DrawContext ctx, Spec sp, int mx, int my) {
                  boolean hover = mx >= sp.x && mx < sp.x + sp.w && my >= sp.y && my < sp.y + sp.h;
                  ctx.fill(sp.x, sp.y, sp.x + sp.w, sp.y + sp.h, 0xFF58585E);
                  ctx.fill(sp.x + 1, sp.y + 1, sp.x + sp.w - 1, sp.y + sp.h - 1, hover ? 0xFF3E3E44 : 0xFF2B2B30);
                  var tr = MinecraftClient.getInstance().textRenderer;
                  int ty = sp.y + (sp.h - 8) / 2;
                  int tx = sp.icon == ICON_HEAD ? sp.x + 18 : sp.x + 8;
                  if (sp.label != null && !sp.label.isEmpty()) {
                      ctx.drawTextWithShadow(tr, Text.literal(sp.label), tx, ty, 0xFFFFFFFF);
                  }
                  switch (sp.icon) {
                      case ICON_SLIDERS: {
                          int ix = sp.x + sp.w - 15;
                          int iy = sp.y + 6;
                          for (int r = 0; r < 3; r++) {
                              int ly = iy + r * 3;
                              ctx.fill(ix, ly, ix + 9, ly + 1, 0xFFE8E8E8);
                              int kx = ix + (r == 0 ? 2 : (r == 1 ? 5 : 3));
                              ctx.fill(kx, ly - 1, kx + 2, ly + 2, 0xFFE8E8E8);
                          }
                          break;
                      }
                      case ICON_SHIRT:
                          art(ctx, sp.x + sp.w - 15, sp.y + 7, new String[]{
                                  ".##...##.", "#########", "#########", ".#######.", ".#######.", ".#######."});
                          break;
                      case ICON_FOLDER:
                          art(ctx, sp.x + (sp.w - 9) / 2, sp.y + 7, new String[]{
                                  "###......", "#########", "#.......#", "#.......#", "#.......#", "#########"});
                          break;
                      case ICON_HEAD:
                          try {
                              PlayerSkinDrawer.draw(ctx, Skins.previewTextures(), sp.x + 5, sp.y + 6, 8);
                          } catch (Throwable t) {
                              art(ctx, sp.x + 5, sp.y + 6, new String[]{
                                      "hhhhhhhh", "hhhhhhhh", "hssssssh", "sbssssbs", "ssssssss", "ssssssss", "ssssssss", "ssssssss"});
                          }
                          break;
                      case ICON_ARROW:
                          art(ctx, sp.x + (sp.w - 7) / 2, sp.y + 8, new String[]{
                                  "#.....#", ".#...#.", "..#.#..", "...#..."});
                          break;
                      default:
                          break;
                  }
              }

              // ------------------------------------------------------------------
              // Interface yang ditempel ke ModelPart lewat mixin (menyimpan "peran" part)
              // role 1..6   = base layer: kepala, badan, tangan kanan, tangan kiri, kaki kanan, kaki kiri
              // role 11..16 = outer layer: hat, jacket, lengan kanan, lengan kiri, celana kanan, celana kiri
              // ------------------------------------------------------------------
              public interface Part {
                  int ts$getRole();

                  void ts$setRole(int role);
              }

              // ------------------------------------------------------------------
              // Config
              // ------------------------------------------------------------------
              public static final class Config {
                  public boolean enabled = true;
                  public boolean everyone = false;
                  public int baseOpacity = 40;
                  public int outerOpacity = 100;
                  public boolean[] hideBase = new boolean[6];
                  public boolean[] hideOuter = new boolean[6];
                  public List<String> cosmetics = new ArrayList<>();
                  public boolean cosmeticHideOriginal = true;
                  public int previewX = 15;
                  public int previewY = 49;
                  public int previewSize = 100;
                  public String selectedSkin = "";
                  public Map<String, Boolean> skinSlim = new HashMap<>();
                  public List<String> accounts = new ArrayList<>();
                  public String currentAccount = "";

                  private static Config instance = new Config();
                  private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

                  public static Config get() {
                      return instance;
                  }

                  private static Path file() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin.json");
                  }

                  public static void load() {
                      try {
                          Path p = file();
                          if (Files.exists(p)) {
                              try (Reader r = Files.newBufferedReader(p, StandardCharsets.UTF_8)) {
                                  Config c = GSON.fromJson(r, Config.class);
                                  if (c != null) {
                                      instance = c;
                                  }
                              }
                          }
                      } catch (Throwable t) {
                          instance = new Config();
                      }
                      instance.sanitize();
                  }

                  public static void save() {
                      try {
                          Files.writeString(file(), GSON.toJson(instance), StandardCharsets.UTF_8);
                      } catch (Throwable ignored) {
                      }
                  }

                  private void sanitize() {
                      baseOpacity = Math.max(0, Math.min(100, baseOpacity));
                      outerOpacity = Math.max(0, Math.min(100, outerOpacity));
                      if (hideBase == null || hideBase.length != 6) {
                          hideBase = new boolean[6];
                      }
                      if (hideOuter == null || hideOuter.length != 6) {
                          hideOuter = new boolean[6];
                      }
                      if (cosmetics == null) {
                          cosmetics = new ArrayList<>();
                      }
                      previewSize = Math.max(50, Math.min(150, previewSize));
                      previewX = Math.max(0, Math.min(100, previewX));
                      previewY = Math.max(0, Math.min(100, previewY));
                      if (selectedSkin == null) {
                          selectedSkin = "";
                      }
                      if (skinSlim == null) {
                          skinSlim = new HashMap<>();
                      }
                      if (accounts == null) {
                          accounts = new ArrayList<>();
                      }
                      while (accounts.size() > 500) {
                          accounts.remove(accounts.size() - 1);
                      }
                      if (currentAccount == null) {
                          currentAccount = "";
                      }
                  }
              }

              // ------------------------------------------------------------------
              // State (dipakai oleh mixin saat render)
              // ------------------------------------------------------------------
              public static final class State {
                  /** true kalau model yang sedang dirender boleh dipengaruhi transparansi */
                  public static boolean active = false;
                  /** true kalau model yang sedang dirender adalah karakter kita sendiri */
                  public static boolean selfNow = false;
                  public static int angleHits = 0;
                  public static int partHits = 0;

                  private State() {
                  }

                  public static void tag(ModelPart part, int role) {
                      if (part != null) {
                          ((Part) (Object) part).ts$setRole(role);
                      }
                  }

                  private static boolean firstPersonNoScreen() {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      return mc != null && mc.currentScreen == null && mc.options != null
                              && mc.options.getPerspective().isFirstPerson();
                  }

                  public static boolean effective() {
                      Config c = Config.get();
                      if (!c.enabled || !active) {
                          return false;
                      }
                      if (!c.everyone && firstPersonNoScreen()) {
                          return false;
                      }
                      return true;
                  }

                  public static boolean isHidden(int role) {
                      if (partHits < 1000000) {
                          partHits++;
                      }
                      if (selfNow && Cosmetics.hidesRole(role) && !firstPersonNoScreen()) {
                          return true;
                      }
                      if (!effective()) {
                          return false;
                      }
                      Config c = Config.get();
                      if (role >= 1 && role <= 6) {
                          return c.hideBase[role - 1];
                      }
                      if (role >= 11 && role <= 16) {
                          return c.hideOuter[role - 11];
                      }
                      return false;
                  }

                  public static int tint(int role, int color) {
                      if (!effective()) {
                          return color;
                      }
                      Config c = Config.get();
                      int pct = role < 10 ? c.baseOpacity : c.outerOpacity;
                      if (pct >= 100) {
                          return color;
                      }
                      int origAlpha = color >>> 24;
                      if (origAlpha == 0) {
                          return color;
                      }
                      int alpha = origAlpha * Math.max(0, pct) / 100;
                      return (alpha << 24) | (color & 0x00FFFFFF);
                  }
              }

              // ------------------------------------------------------------------
              // Cosmetic: baca file .bbmodel (Blockbench) dari config/transparent-skin/cosmetics
              // Nama file: <slot>_<nama>.bbmodel, slot = head, body, rightarm, leftarm, rightleg, leftleg
              // ------------------------------------------------------------------
              public static final class Cosmetics {
                  public static final String[] SLOT_KEYS = {"head", "body", "rightarm", "leftarm", "rightleg", "leftleg"};
                  public static final String[] SLOT_LABELS = {"Kepala", "Badan", "Tangan kanan", "Tangan kiri", "Kaki kanan", "Kaki kiri"};
                  // pivot tiap slot di ruang Blockbench (y ke atas, kaki di y=0, depan = arah -Z)
                  private static final double[][] PIVOTS = {
                          {0, 24, 0}, {0, 24, 0}, {-5, 22, 0}, {5, 22, 0}, {-1.9, 12, 0}, {1.9, 12, 0}
                  };

                  public static final class Loaded {
                      public final String display;
                      public final String fileKey;
                      public final int slot;
                      public final Identifier texture;
                      private final ModelData data;
                      private final int texW;
                      private final int texH;

                      Loaded(String display, String fileKey, int slot, Identifier texture, ModelData data, int texW, int texH) {
                          this.display = display;
                          this.fileKey = fileKey;
                          this.slot = slot;
                          this.texture = texture;
                          this.data = data;
                          this.texW = texW;
                          this.texH = texH;
                      }

                      public ModelPart buildRoot() {
                          return TexturedModelData.of(data, texW, texH).createModel();
                      }
                  }

                  public static final List<Loaded> ALL = new ArrayList<>();
                  public static final List<Loaded> SELECTED = new ArrayList<>();
                  private static final boolean[] HIDDEN = new boolean[20];
                  public static String error = "";
                  public static int version = 0;

                  private Cosmetics() {
                  }

                  public static Path dir() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin").resolve("cosmetics");
                  }

                  public static void reload() {
                      ALL.clear();
                      error = "";
                      try {
                          Files.createDirectories(dir());
                      } catch (Throwable t) {
                          error = String.valueOf(t);
                      }
                      try (Stream<Path> st = Files.list(dir())) {
                          List<Path> files = new ArrayList<>();
                          st.forEach(files::add);
                          files.sort((a, b) -> a.getFileName().toString().compareToIgnoreCase(b.getFileName().toString()));
                          for (Path p : files) {
                              String fn = p.getFileName().toString();
                              if (!fn.toLowerCase().endsWith(".bbmodel")) {
                                  continue;
                              }
                              try {
                                  ALL.add(parse(p, fn.substring(0, fn.length() - 8)));
                              } catch (Throwable t) {
                                  error = fn + ": " + t.getMessage();
                              }
                          }
                      } catch (Throwable t) {
                          error = String.valueOf(t);
                      }
                      version++;
                      recompute();
                  }

                  private static double[] arr3(JsonObject o, String key) {
                      JsonArray a = o.getAsJsonArray(key);
                      return new double[]{a.get(0).getAsDouble(), a.get(1).getAsDouble(), a.get(2).getAsDouble()};
                  }

                  private static Loaded parse(Path path, String base) throws Exception {
                      String lower = base.toLowerCase();
                      int us = lower.indexOf('_');
                      String prefix = us > 0 ? lower.substring(0, us) : lower;
                      int slot = -1;
                      for (int i = 0; i < SLOT_KEYS.length; i++) {
                          if (SLOT_KEYS[i].equals(prefix)) {
                              slot = i;
                          }
                      }
                      if (slot < 0) {
                          throw new IllegalArgumentException("nama file harus diawali head_, body_, rightarm_, leftarm_, rightleg_, atau leftleg_");
                      }
                      String display = us > 0 && us < base.length() - 1 ? base.substring(us + 1) : base;

                      String json = Files.readString(path, StandardCharsets.UTF_8);
                      JsonObject root = JsonParser.parseString(json).getAsJsonObject();

                      int texW = 64;
                      int texH = 64;
                      if (root.has("resolution") && root.get("resolution").isJsonObject()) {
                          JsonObject res = root.getAsJsonObject("resolution");
                          texW = res.get("width").getAsInt();
                          texH = res.get("height").getAsInt();
                      }

                      // texture pertama (disimpan di dalam file .bbmodel sebagai base64)
                      JsonArray textures = root.has("textures") ? root.getAsJsonArray("textures") : null;
                      if (textures == null || textures.size() == 0) {
                          throw new IllegalStateException("tidak ada texture di model");
                      }
                      String src = textures.get(0).getAsJsonObject().get("source").getAsString();
                      int comma = src.indexOf(',');
                      if (!src.startsWith("data:") || comma < 0) {
                          throw new IllegalStateException("texture harus tersimpan di dalam file (bukan path luar)");
                      }
                      byte[] bytes = Base64.getMimeDecoder().decode(src.substring(comma + 1));
                      NativeImage img = NativeImage.read(new ByteArrayInputStream(bytes));

                      String idPath = "cosmetic/" + lower.replaceAll("[^a-z0-9_.-]", "_");
                      Identifier id = Identifier.of("transparentskin", idPath);
                      final String texName = "transparentskin_" + lower;
                      NativeImageBackedTexture tex = new NativeImageBackedTexture(() -> texName, img);
                      MinecraftClient.getInstance().getTextureManager().registerTexture(id, tex);

                      // cube -> ModelData (relatif terhadap pivot slot)
                      double[] piv = PIVOTS[slot];
                      ModelData md = new ModelData();
                      ModelPartData rootData = md.getRoot();
                      JsonArray els = root.getAsJsonArray("elements");
                      int n = 0;
                      if (els != null) {
                          for (JsonElement e : els) {
                              JsonObject o = e.getAsJsonObject();
                              String type = o.has("type") ? o.get("type").getAsString() : "cube";
                              if (!"cube".equals(type)) {
                                  continue;
                              }
                              if (o.has("export") && !o.get("export").getAsBoolean()) {
                                  continue;
                              }
                              double[] from = arr3(o, "from");
                              double[] to = arr3(o, "to");
                              double[] origin = o.has("origin") ? arr3(o, "origin") : from;
                              double[] rot = o.has("rotation") ? arr3(o, "rotation") : new double[]{0, 0, 0};
                              float inflate = o.has("inflate") ? o.get("inflate").getAsFloat() : 0f;
                              boolean mirror = o.has("mirror_uv") && o.get("mirror_uv").getAsBoolean();

                              int u = 0;
                              int v = 0;
                              boolean boxUv = o.has("box_uv") && o.get("box_uv").getAsBoolean();
                              if (boxUv && o.has("uv_offset")) {
                                  JsonArray uo = o.getAsJsonArray("uv_offset");
                                  u = uo.get(0).getAsInt();
                                  v = uo.get(1).getAsInt();
                              } else if (o.has("faces") && o.getAsJsonObject("faces").has("north")) {
                                  // UV per-face: perkirakan offset box dari sisi depan (north)
                                  JsonArray uv = o.getAsJsonObject("faces").getAsJsonObject("north").getAsJsonArray("uv");
                                  double d = Math.abs(to[2] - from[2]);
                                  double fu = Math.min(uv.get(0).getAsDouble(), uv.get(2).getAsDouble());
                                  double fv = Math.min(uv.get(1).getAsDouble(), uv.get(3).getAsDouble());
                                  u = (int) Math.round(fu - d);
                                  v = (int) Math.round(fv - d);
                              }

                              float px = (float) (origin[0] - piv[0]);
                              float py = (float) (piv[1] - origin[1]);
                              float pz = (float) (origin[2] - piv[2]);
                              float cx = (float) (from[0] - origin[0]);
                              float cy = (float) (origin[1] - to[1]);
                              float cz = (float) (from[2] - origin[2]);
                              float sx = (float) (to[0] - from[0]);
                              float sy = (float) (to[1] - from[1]);
                              float sz = (float) (to[2] - from[2]);

                              rootData.addChild("c" + n,
                                      ModelPartBuilder.create()
                                              .uv(u, v)
                                              .mirrored(mirror)
                                              .cuboid(cx, cy, cz, sx, sy, sz, new Dilation(inflate)),
                                      ModelTransform.of(px, py, pz,
                                              (float) Math.toRadians(-rot[0]),
                                              (float) Math.toRadians(rot[1]),
                                              (float) Math.toRadians(-rot[2])));
                              n++;
                          }
                      }
                      if (n == 0) {
                          throw new IllegalStateException("tidak ada cube di model");
                      }
                      return new Loaded(display, base, slot, id, md, texW, texH);
                  }

                  public static boolean isSelected(Loaded l) {
                      return Config.get().cosmetics.contains(l.fileKey);
                  }

                  public static void toggle(Loaded l) {
                      List<String> sel = Config.get().cosmetics;
                      if (sel.contains(l.fileKey)) {
                          sel.remove(l.fileKey);
                      } else {
                          // satu cosmetic per slot
                          for (Loaded other : ALL) {
                              if (other.slot == l.slot) {
                                  sel.remove(other.fileKey);
                              }
                          }
                          sel.add(l.fileKey);
                      }
                      Config.save();
                      recompute();
                  }

                  public static void recompute() {
                      SELECTED.clear();
                      for (int i = 0; i < HIDDEN.length; i++) {
                          HIDDEN[i] = false;
                      }
                      Config c = Config.get();
                      for (Loaded l : ALL) {
                          if (c.cosmetics.contains(l.fileKey)) {
                              SELECTED.add(l);
                              if (c.cosmeticHideOriginal) {
                                  HIDDEN[l.slot + 1] = true;
                                  HIDDEN[l.slot + 11] = true;
                              }
                          }
                      }
                  }

                  public static boolean hidesRole(int role) {
                      return role > 0 && role < HIDDEN.length && HIDDEN[role];
                  }
              }

              // ------------------------------------------------------------------
              // Model cosmetic: ikut pose bagian tubuh yang dipilih
              // ------------------------------------------------------------------
              public static final class CosmeticModel extends EntityModel<PlayerEntityRenderState> {
                  private final PlayerEntityModel pose;
                  private final int slot;

                  public CosmeticModel(ModelPart root, PlayerEntityModel pose, int slot) {
                      super(root);
                      this.pose = pose;
                      this.slot = slot;
                  }

                  @Override
                  public void setAngles(PlayerEntityRenderState state) {
                      super.setAngles(state);
                      this.pose.setAngles(state);
                      ModelPart src;
                      switch (this.slot) {
                          case 0:
                              src = this.pose.head;
                              break;
                          case 1:
                              src = this.pose.body;
                              break;
                          case 2:
                              src = this.pose.rightArm;
                              break;
                          case 3:
                              src = this.pose.leftArm;
                              break;
                          case 4:
                              src = this.pose.rightLeg;
                              break;
                          default:
                              src = this.pose.leftLeg;
                              break;
                      }
                      this.root.setTransform(src.getTransform());
                  }
              }

              public static final class CosmeticFeature extends FeatureRenderer<PlayerEntityRenderState, PlayerEntityModel> {
                  private final Map<Cosmetics.Loaded, CosmeticModel> cache = new HashMap<>();
                  private int cacheVersion = -1;

                  public CosmeticFeature(FeatureRendererContext<PlayerEntityRenderState, PlayerEntityModel> context) {
                      super(context);
                  }

                  @Override
                  public void render(MatrixStack matrices, OrderedRenderCommandQueue queue, int light,
                                     PlayerEntityRenderState state, float yaw, float pitch) {
                      try {
                          if (state.invisible || Cosmetics.SELECTED.isEmpty()) {
                              return;
                          }
                          MinecraftClient mc = MinecraftClient.getInstance();
                          if (mc.player == null || state.id != mc.player.getId()) {
                              return;
                          }
                          if (cacheVersion != Cosmetics.version) {
                              cache.clear();
                              cacheVersion = Cosmetics.version;
                          }
                          for (Cosmetics.Loaded l : Cosmetics.SELECTED) {
                              CosmeticModel m = cache.get(l);
                              if (m == null) {
                                  m = new CosmeticModel(l.buildRoot(), this.getContextModel(), l.slot);
                                  cache.put(l, m);
                              }
                              queue.submitModel(m, state, matrices, RenderLayer.getEntityTranslucent(l.texture),
                                      light, OverlayTexture.DEFAULT_UV, 0, null);
                          }
                      } catch (Throwable t) {
                          Cosmetics.error = String.valueOf(t);
                      }
                  }
              }

