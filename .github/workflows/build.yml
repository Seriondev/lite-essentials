          package com.vizkovico.transparentskin.mixin;

          import com.vizkovico.transparentskin.TransparentSkinMod;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.AbstractClientPlayerEntity;
          import net.minecraft.entity.player.SkinTextures;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(AbstractClientPlayerEntity.class)
          public abstract class AbstractClientPlayerEntityMixin {

              @Inject(
                      method = "getSkin()Lnet/minecraft/entity/player/SkinTextures;",
                      at = @At("RETURN"),
                      cancellable = true,
                      require = 0
              )
              private void ts$skin(CallbackInfoReturnable<SkinTextures> cir) {
                  try {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (mc != null && (Object) this == mc.player) {
                          SkinTextures original = cir.getReturnValue();
                          SkinTextures replaced = TransparentSkinMod.Skins.apply(original);
                          if (replaced != original) {
                              cir.setReturnValue(replaced);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }
          }
