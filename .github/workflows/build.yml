              public static final class ConfigScreen extends Screen {
                  private static final String[] BASE_NAMES = {"Kepala", "Badan", "Tangan kanan", "Tangan kiri", "Kaki kanan", "Kaki kiri"};
                  private static final String[] OUTER_NAMES = {"Hat", "Jacket", "Lengan kanan", "Lengan kiri", "Celana kanan", "Celana kiri"};

                  private final Screen parent;
                  private int page = 0; // 0 utama, 1 bagian tubuh, 2 cosmetic
                  private int cosPage = 0;
                  private int headerY = 20;
                  private int leftCenterX = 0;
                  private int rightCenterX = 0;

                  public ConfigScreen(Screen parent) {
                      super(Text.literal("Skin Transparan"));
                      this.parent = parent;
                  }

                  public ConfigScreen(Screen parent, int startPage) {
                      this(parent);
                      this.page = startPage;
                  }

                  @Override
                  protected void init() {
                      if (page == 0) {
                          initMain();
                      } else if (page == 1) {
                          initParts();
                      } else if (page == 3) {
                          initPreview();
                      } else {
                          initCosmetics();
                      }
                  }

                  private void initMain() {
                      Config c = Config.get();
                      int w = Math.min(210, this.width - 20);
                      int x = (this.width - w) / 2;
                      int y = Math.max(28, (this.height - 170) / 2);

                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Skin transparan: " + (c.enabled ? "ON" : "OFF")),
                              b -> {
                                  c.enabled = !c.enabled;
                                  b.setMessage(Text.literal("Skin transparan: " + (c.enabled ? "ON" : "OFF")));
                              }).dimensions(x, y, w, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Berlaku untuk: " + (c.everyone ? "Semua pemain" : "Diri sendiri")),
                              b -> {
                                  c.everyone = !c.everyone;
                                  b.setMessage(Text.literal("Berlaku untuk: " + (c.everyone ? "Semua pemain" : "Diri sendiri")));
                              }).dimensions(x, y + 24, w, 20).build());

                      this.addDrawableChild(new OpacitySlider(x, y + 48, w, 20, "Opacity base layer", c.baseOpacity, v -> c.baseOpacity = v));
                      this.addDrawableChild(new OpacitySlider(x, y + 72, w, 20, "Opacity outer layer", c.outerOpacity, v -> c.outerOpacity = v));

                      int tw = (w - 8) / 3;
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Tubuh >"), b -> {
                          page = 1;
                          this.clearAndInit();
                      }).dimensions(x, y + 96, tw, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Cosmetic >"), b -> {
                          page = 2;
                          this.clearAndInit();
                      }).dimensions(x + tw + 4, y + 96, tw, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Preview >"), b -> {
                          page = 3;
                          this.clearAndInit();
                      }).dimensions(x + 2 * (tw + 4), y + 96, tw, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Selesai"), b -> this.close())
                              .dimensions(x, y + 124, w, 20).build());
                  }

                  private void initParts() {
                      Config c = Config.get();
                      int gap = 10;
                      int cw = Math.min(150, (this.width - 30) / 2);
                      int lx = this.width / 2 - gap / 2 - cw;
                      int rx = this.width / 2 + gap / 2;
                      int y = Math.max(34, (this.height - 176) / 2 + 6);

                      this.headerY = y - 12;
                      this.leftCenterX = lx + cw / 2;
                      this.rightCenterX = rx + cw / 2;

                      for (int i = 0; i < 6; i++) {
                          addPartButton(lx, y + i * 22, cw, BASE_NAMES[i], c.hideBase, i);
                          addPartButton(rx, y + i * 22, cw, OUTER_NAMES[i], c.hideOuter, i);
                      }

                      int w = Math.min(210, this.width - 20);
                      int x = (this.width - w) / 2;
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("< Kembali"), b -> {
                          page = 0;
                          this.clearAndInit();
                      }).dimensions(x, y + 6 * 22 + 4, w, 20).build());
                  }

                  private void addPartButton(int x, int y, int w, String name, boolean[] hideArray, int index) {
                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal(partLabel(name, hideArray[index])),
                              b -> {
                                  hideArray[index] = !hideArray[index];
                                  b.setMessage(Text.literal(partLabel(name, hideArray[index])));
                              }).dimensions(x, y, w, 20).build());
                  }

                  private void initPreview() {
                      Config c = Config.get();
                      int w = Math.min(210, this.width - 20);
                      int x = (this.width - w) / 2;
                      int y = Math.max(34, (this.height - 100) / 2);

                      this.addDrawableChild(new RangeSlider(x, y, w, 20, "Posisi X", 0, 100, c.previewX, v -> c.previewX = v));
                      this.addDrawableChild(new RangeSlider(x, y + 24, w, 20, "Posisi Y", 0, 100, c.previewY, v -> c.previewY = v));
                      this.addDrawableChild(new RangeSlider(x, y + 48, w, 20, "Ukuran", 50, 150, c.previewSize, v -> c.previewSize = v));

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("< Kembali"), b -> {
                          page = 0;
                          this.clearAndInit();
                      }).dimensions(x, y + 76, w, 20).build());
                  }

                  private static String partLabel(String name, boolean hidden) {
                      return name + ": " + (hidden ? "Hilang" : "Tampil");
                  }

                  private static String cosLabel(Cosmetics.Loaded l) {
                      return l.display + " (" + Cosmetics.SLOT_LABELS[l.slot] + "): " + (Cosmetics.isSelected(l) ? "ON" : "OFF");
                  }

                  private void initCosmetics() {
                      Config c = Config.get();
                      int w = Math.min(210, this.width - 20);
                      int x = (this.width - w) / 2;
                      int y = Math.max(34, (this.height - 190) / 2 + 8);
                      this.headerY = y;

                      List<Cosmetics.Loaded> all = Cosmetics.ALL;
                      int perPage = 5;
                      int pages = Math.max(1, (all.size() + perPage - 1) / perPage);
                      if (cosPage >= pages) {
                          cosPage = pages - 1;
                      }
                      for (int i = 0; i < perPage; i++) {
                          int idx = cosPage * perPage + i;
                          if (idx >= all.size()) {
                              break;
                          }
                          Cosmetics.Loaded l = all.get(idx);
                          this.addDrawableChild(ButtonWidget.builder(Text.literal(cosLabel(l)), b -> {
                              Cosmetics.toggle(l);
                              b.setMessage(Text.literal(cosLabel(l)));
                          }).dimensions(x, y + i * 22, w, 20).build());
                      }

                      int ny = y + perPage * 22;
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("<"), b -> {
                          if (cosPage > 0) {
                              cosPage--;
                              this.clearAndInit();
                          }
                      }).dimensions(x, ny, 24, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(Text.literal("Muat ulang folder"), b -> {
                          Cosmetics.reload();
                          cosPage = 0;
                          this.clearAndInit();
                      }).dimensions(x + 28, ny, w - 56, 20).build());
                      this.addDrawableChild(ButtonWidget.builder(Text.literal(">"), b -> {
                          cosPage++;
                          this.clearAndInit();
                      }).dimensions(x + w - 24, ny, 24, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(
                              Text.literal("Sembunyikan bagian asli: " + (c.cosmeticHideOriginal ? "ON" : "OFF")),
                              b -> {
                                  c.cosmeticHideOriginal = !c.cosmeticHideOriginal;
                                  Cosmetics.recompute();
                                  b.setMessage(Text.literal("Sembunyikan bagian asli: " + (c.cosmeticHideOriginal ? "ON" : "OFF")));
                              }).dimensions(x, ny + 22, w, 20).build());

                      this.addDrawableChild(ButtonWidget.builder(Text.literal("< Kembali"), b -> {
                          page = 0;
                          this.clearAndInit();
                      }).dimensions(x, ny + 44, w, 20).build());
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                      // sengaja kosong: dunia tetap kelihatan jelas (tekan F5 untuk lihat karakter sendiri)
                  }

                  @Override
                  public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                      super.render(context, mouseX, mouseY, delta);
                      context.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, 10, 0xFFFFFFFF);

                      if (page == 1) {
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Base layer"), leftCenterX, headerY, 0xFFFFFFFF);
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Outer layer"), rightCenterX, headerY, 0xFFFFFFFF);
                      } else if (page == 2) {
                          if (Cosmetics.ALL.isEmpty()) {
                              context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Belum ada cosmetic. Taruh file .bbmodel di:"), this.width / 2, headerY + 8, 0xFFFFFFFF);
                              context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("config/transparent-skin/cosmetics"), this.width / 2, headerY + 22, 0xFFFFFF55);
                              context.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Nama file: rightleg_korblox.bbmodel"), this.width / 2, headerY + 36, 0xFFAAAAAA);
                          }
                          String err = Cosmetics.error;
                          if (!err.isEmpty()) {
                              if (err.length() > 70) {
                                  err = err.substring(0, 70);
                              }
                              context.drawCenteredTextWithShadow(this.textRenderer, Text.literal(err), this.width / 2, this.height - 12, 0xFFFF5555);
                          }
                      } else if (page == 0) {
                          String status = "Hook: model " + (State.angleHits > 0 ? "OK" : "-") + ", part " + (State.partHits > 0 ? "OK" : "-")
                                  + " | cosmetic: " + Cosmetics.ALL.size();
                          context.drawCenteredTextWithShadow(this.textRenderer, Text.literal(status), this.width / 2, this.height - 12, 0xFFAAAAAA);
                      }
                  }

                  @Override
